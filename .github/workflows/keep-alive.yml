name: Keep Alive

on:
  schedule:
    # Keep scheduled workflows enabled — GitHub disables them after 60 days of no repository activity.
    # Fires on the 1st and 21st of every other month; max gap ~41 days, comfortably under 60.
    - cron: "0 0 1,21 */2 *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      # The ruleset refuses a direct commit to main, so this re-enables through the API instead.
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in generate-feed.yml keep-alive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done
