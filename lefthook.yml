# Runs the checks CI runs before a push (the steps of `just check`). `npm install` enables it, through the `prepare` script.
# git exports repo-local variables such as GIT_DIR to a hook; from a linked worktree they point tools at the wrong repository.
pre-push:
  commands:
    ci:
      run: |
        unset $(git rev-parse --local-env-vars)
        npm run lint && npm run format:check && npm run type-check && npm test
